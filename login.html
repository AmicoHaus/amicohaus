<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Amico Haus</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <a class="agent-strip" href="/about">Presented by <strong>Rudy Flores</strong> &middot; Coldwell Banker West &middot; DRE #02257808</a>
  <header class="topbar">
    <a class="brand" href="/">
      <svg viewBox="0 0 48 48" class="logo" aria-hidden="true">
        <path d="M24 4 L44 20 V42 H30 V28 H18 V42 H4 V20 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      </svg>
      <span class="brand-text">AMICO <span class="accent">HAUS</span></span>
    </a>
  </header>
  <main class="auth-main">
    <div class="auth-card">
      <h1>Log in</h1>

      <form id="loginForm" class="profile-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required maxlength="200" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required maxlength="200" placeholder="Your password">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Log In</button>
        </div>
      </form>

      <form id="twoFactorForm" class="profile-form hidden">
        <div class="field">
          <label for="twoFactorCode">Enter the 6-digit code from your authenticator app</label>
          <input type="text" id="twoFactorCode" required maxlength="6" pattern="[0-9]{6}" placeholder="123456" inputmode="numeric">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="twoFactorSubmitBtn">Verify</button>
        </div>
      </form>

      <p class="form-note hidden" id="unconfirmedRow" role="status">Haven't opened your confirmation link yet? <button type="button" class="link-btn" id="resendLinkBtn">Email me a new one</button>.</p>
      <p class="form-note"><a href="/forgot-password">Forgot password?</a></p>
      <p class="form-note">Need an account? <a href="/signup">Sign up</a></p>
    </div>
  </main>
</div>
<script src="client.js"></script>
<script src="page-login.js"></script>
<!-- Cloudflare Web Analytics -->

<!-- End Cloudflare Web Analytics -->
</body>
</html>
