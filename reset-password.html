<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a New Password — Amico Haus</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <a class="agent-strip" href="/about">Presented by <strong>Rudy Flores</strong> &middot; Coldwell Banker West &middot; DRE #02257808</a>
  <header class="topbar">
    <a class="brand" href="/">
      <svg viewBox="0 0 48 48" class="logo" aria-hidden="true">
        <path d="M24 4 L44 20 V42 H30 V28 H18 V42 H4 V20 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      </svg>
      <span class="brand-text">AMICO <span class="accent">HAUS</span></span>
    </a>
  </header>
  <main class="auth-main">
    <div class="auth-card">
      <h1>Set a new password</h1>

      <form id="resetForm" class="profile-form">
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" required minlength="8" maxlength="200" placeholder="At least 8 characters">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Set Password</button>
        </div>
      </form>
      <p class="form-note" id="resultNote"></p>
    </div>
  </main>
</div>
<script src="client.js"></script>
<script src="page-reset-password.js"></script>

<!-- End Cloudflare Web Analytics -->
</body>
</html>
